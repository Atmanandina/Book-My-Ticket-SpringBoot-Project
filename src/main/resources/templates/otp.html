<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OTP Verification</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
  <style>
    body {
      background: linear-gradient(135deg, #4c6ef5, #15aabf);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      font-family: 'Segoe UI', sans-serif;
    }

    .otp-card {
      background: #ffffff;
      padding: 40px 30px;
      border-radius: 18px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.15);
      width: 100%;
      max-width: 420px;
      animation: fadeIn 0.8s ease;
    }

    .otp-card h2 {
      font-weight: 700;
      color: #333;
    }

    .form-control {
      height: 50px;
      border-radius: 12px;
      font-size: 16px;
    }

    button {
      height: 50px;
      width: 100%;
      border-radius: 12px;
      font-size: 18px;
      font-weight: 600;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>
  <div aria-live="polite" aria-atomic="true" class="position-relative">
    <div class="toast-container position-fixed top-0 end-0 p-3">

      <div th:if="${pass}" class="toast bg-success text-white border-0">
        <div class="toast-header bg-success text-white">
          <strong class="me-auto">Success</strong>
          <button class="btn-close btn-close-white" data-bs-dismiss="toast"></button>
        </div>
        <div class="toast-body" th:text="${pass}"></div>
      </div>

      <div th:if="${fail}" class="toast bg-danger text-white border-0">
        <div class="toast-header bg-danger text-white">
          <strong class="me-auto">Error</strong>
          <button class="btn-close btn-close-white" data-bs-dismiss="toast"></button>
        </div>
        <div class="toast-body" th:text="${fail}"></div>
      </div>

    </div>
  </div>

  <div class="otp-card">
    <h2 class="text-center mb-4">OTP Verification</h2>

    <form action="/otp" method="post">
      <input type="hidden" name="email" th:value="${email}" />

      <label class="form-label fw-semibold">Enter OTP</label>
      <input type="number" name="otp" placeholder="Enter OTP" class="form-control mb-3" required />

      <button class="btn btn-primary">Submit</button>
    </form>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    document.querySelectorAll('.toast').forEach(toastEl => {
      new bootstrap.Toast(toastEl).show();
    });
  </script>
</body>
</html>
